version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=TaskManagementDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - JwtSettings__Secret=THIS_IS_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS!
      - JwtSettings__Issuer=TaskManagement.API
      - JwtSettings__Audience=TaskManagement.Client
      - JwtSettings__ExpiryMinutes=60
      - AdminSeed__Email=admin@taskmanagement.com
      - AdminSeed__Password=Admin@123456
      - AdminSeed__FullName=System Admin

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata: